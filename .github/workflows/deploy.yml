name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full main commit SHA with successful CI (empty = main)
        required: false
      migrations_approved:
        description: Approve new migrations (not required when schema is unchanged)
        type: boolean
        default: false
      backup_confirmed:
        description: Fresh provider backup confirmed before new migrations
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Deploy checked source with VPS cache
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          MIGRATIONS_APPROVED: ${{ inputs.migrations_approved && 'yes' || 'no' }}
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Configure production SSH secrets or use the same CLI locally}"
          : "${DEPLOY_USER:?DEPLOY_USER required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY required}"
          : "${DEPLOY_KNOWN_HOSTS:?Pinned SSH host key required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_release
          chmod 600 ~/.ssh/id_release
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_release\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          export SSH_TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          node deploy/scripts/release.mjs ${DEPLOY_SHA:+"$DEPLOY_SHA"}
