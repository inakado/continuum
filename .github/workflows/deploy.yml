name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Branch to deploy
        required: true
        default: main
      migrations_approved:
        description: Allow prisma migrate deploy during the maintenance window
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Ensure migrations are approved
        if: ${{ github.event.inputs.migrations_approved != 'yes' }}
        run: |
          echo "Production migrations require explicit approval."
          exit 1

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ github.event.inputs.deploy_ref }}
          MIGRATIONS_APPROVED: ${{ github.event.inputs.migrations_approved }}
          APP_DIR: ${{ secrets.APP_DIR }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          AUTH_SMOKE_LOGIN: ${{ secrets.AUTH_SMOKE_LOGIN }}
          AUTH_SMOKE_PASSWORD: ${{ secrets.AUTH_SMOKE_PASSWORD }}
          AUTH_SMOKE_PROTECTED_PATH: ${{ secrets.AUTH_SMOKE_PROTECTED_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_REF,MIGRATIONS_APPROVED,APP_DIR,APP_DOMAIN,AUTH_SMOKE_LOGIN,AUTH_SMOKE_PASSWORD,AUTH_SMOKE_PROTECTED_PATH
          script_stop: true
          script: |
            set -eu

            if [ -z "${APP_DIR:-}" ] || [ -z "${APP_DOMAIN:-}" ]; then
              echo "APP_DIR and APP_DOMAIN secrets are required"
              exit 1
            fi

            cd "$APP_DIR"
            if [ -n "$(git status --short)" ]; then
              echo "Working tree must be clean before deploy"
              exit 1
            fi

            previous_head="$(git rev-parse HEAD)"
            git fetch --all --prune
            git checkout "$DEPLOY_REF"
            git merge --ff-only "origin/$DEPLOY_REF"

            PREVIOUS_HEAD="$previous_head" \
            MIGRATIONS_APPROVED="$MIGRATIONS_APPROVED" \
            APP_DOMAIN="$APP_DOMAIN" \
            AUTH_SMOKE_LOGIN="$AUTH_SMOKE_LOGIN" \
            AUTH_SMOKE_PASSWORD="$AUTH_SMOKE_PASSWORD" \
            AUTH_SMOKE_PROTECTED_PATH="${AUTH_SMOKE_PROTECTED_PATH:-/student/me}" \
              ./deploy/scripts/deploy-on-vps.sh
