name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://continuum:continuum@localhost:5432/continuum
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Classify changes
        id: scope
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/release.mjs scope "$BASE_REVISION"
      - name: Reuse a verified release
        id: release
        run: node scripts/ci/release.mjs reuse
      - name: Docs check
        run: pnpm docs:check
      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true' && steps.release.outputs.reused != 'true'
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        if: steps.scope.outputs.docs_only != 'true' && steps.release.outputs.reused != 'true'
        run: pnpm --filter @continuum/api exec prisma generate
      - name: Lint and boundaries
        if: steps.scope.outputs.docs_only != 'true' && steps.release.outputs.reused != 'true'
        run: |
          pnpm lint
          pnpm lint:boundaries
      - name: Build backend image (Docker only)
        if: steps.scope.outputs.docs_only != 'true' && steps.release.outputs.reused != 'true'
        run: pnpm build:backend
      - name: Build web and shared
        if: steps.scope.outputs.docs_only != 'true' && steps.release.outputs.reused != 'true'
        env:
          NEXT_PUBLIC_API_BASE_URL: https://vl-physics.ru/api
        run: pnpm build:web
      - name: Typecheck and test
        if: steps.scope.outputs.docs_only != 'true' && steps.release.outputs.reused != 'true'
        run: |
          pnpm typecheck
          pnpm test
          node --test scripts/ci/release.test.mjs
          python3 -m unittest discover -s deploy/scripts -p 'test_*.py'
      - name: Record checked source
        if: steps.scope.outputs.docs_only != 'true' && steps.release.outputs.reused != 'true'
        run: printf '%s\n' '${{ steps.scope.outputs.fingerprint }}' > checked-source.txt
      - name: Retain source verification for one day
        if: steps.scope.outputs.docs_only != 'true' && steps.release.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: checked-${{ steps.scope.outputs.fingerprint }}
          path: checked-source.txt
          if-no-files-found: error
          retention-days: 1

  security:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://continuum:continuum@localhost:5432/continuum
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (high+)
        run: pnpm audit --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
