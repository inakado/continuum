# Replace app.example.com with your domain before enabling this config.
# Note: this is SSL-ready config and requires existing cert files in
# /etc/letsencrypt/live/<domain>/. For first setup, use HTTP-only bootstrap
# config from deploy/README.md, then run certbot, then switch to this file.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Only assessment GETs may compress JSON; auth, credentials and writes stay off.
map "$request_method:$uri" $continuum_skip_json_gzip {
  default 1;
  "~^GET:/api/(teacher/(assessment-bank|assessment-works|assessment-assignments|assessment-statistics)|student/assessment-works)(/|$)" 0;
}

server {
  listen 80;
  listen [::]:80;
  server_name app.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.example.com;

  ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 25m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /api {
    return 301 /api/;
  }

  location ^~ /api/internal/ {
    return 404;
  }

  location /api/ {
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied no-cache no-store private auth;
    if ($continuum_skip_json_gzip) { gzip off; }

    client_max_body_size 210m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
