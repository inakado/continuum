name: continuum

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_RUNTIME_IMAGE: ${NODE_RUNTIME_IMAGE:-node:24.18.0-bookworm-slim}
    container_name: continuum-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-3000}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-continuum}
      POSTGRES_USER: ${POSTGRES_USER:-continuum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continuum}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-continuum}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
    command: sh -c "if [ ! -d /app/node_modules/.pnpm ] || [ ! -d /app/apps/api/node_modules/helmet ] || [ ! -d /app/apps/api/node_modules/@prisma/client ] || [ ! -d /app/apps/api/node_modules/zod ] || [ ! -d /app/apps/api/node_modules/@thallesp/nestjs-better-auth ] || [ ! -d /app/apps/api/node_modules/better-auth ]; then CI=true pnpm install --force --reporter=append-only --filter @continuum/api... --frozen-lockfile; fi; pnpm --filter @continuum/api exec tsc -p /app/packages/shared/tsconfig.json; if [ ! -d /app/node_modules/.prisma/client ]; then pnpm --filter @continuum/api exec prisma generate; fi; pnpm --filter @continuum/api dev"
    working_dir: /app

  postgres:
    image: postgres:16-alpine
    container_name: continuum-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-continuum}
      POSTGRES_USER: ${POSTGRES_USER:-continuum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continuum}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-continuum} -d ${POSTGRES_DB:-continuum}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: continuum-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  api_node_modules:
  api_app_node_modules:
  postgres_data:
  minio_data:
